# 2026-10-03 Track A.4: chart tests (lint and render with the real values, kubeconform against the
# QueueBackedService contract, release immutability without pushing). Release itself: release.yaml.
# O-1: REQUIRED status check (chart-checks) for pull requests to main.
name: CI

on:
  push:
    # ci-selftest/* branches run the checks without a pull request (negative tests of the CI itself)
    branches: [main, "ci-selftest/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: platform-charts
      # The CI toolkit (ci/) and the ApplicationSets live in gitops-control-plane (main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunobml/gitops-control-plane
          ref: main
          path: gitops-control-plane
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gitops-control-plane/ci/labci/go.mod
          cache-dependency-path: gitops-control-plane/ci/labci/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r gitops-control-plane/ci/requirements.txt
      - run: gitops-control-plane/ci/check-charts.sh
        env:
          PLATFORM_CHARTS_DIR: platform-charts
