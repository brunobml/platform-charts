name: Release Charts to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

# Least privilege
permissions:
  contents: read
  packages: write

# Supply-chain & immutability guards (2026-10-03 remediation Step 0.2, finding L2-1):
# - Every action is pinned by commit SHA.
# - Existing OCI chart versions are checked: if identical, push is skipped; if modified without
#   version bump, the job fails to prevent silent release overwrites.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24; validation-01 V-9)
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1 (node24; validation-01 V-9)
        with:
          version: v3.14.0

      - name: Helm Registry Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Lint Helm Charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" --set image=placeholder:latest
            fi
          done

      - name: Package and Release Charts with Immutability Guard
        run: |
          mkdir -p dist
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for chart in charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              # Name and version from Helm's own normalized view of Chart.yaml (no quote handling needed).
              # (validation-01 V-1: the previous tr -d quoting was a bash syntax error.)
              chart_name=$(helm show chart "$chart" | awk '/^name:/ {print $2; exit}')
              chart_version=$(helm show chart "$chart" | awk '/^version:/ {print $2; exit}')
              if [ -z "$chart_name" ] || [ -z "$chart_version" ]; then
                echo "::error::Cannot read name/version from ${chart}/Chart.yaml"
                exit 1
              fi
              echo "=================================================="
              echo "Processing chart: ${chart_name} (version ${chart_version})"
              echo "=================================================="

              # Package the local chart into dist
              helm package "$chart" -d dist/
              pkg_file="dist/${chart_name}-${chart_version}.tgz"

              # Does this version already exist in GHCR? Only an explicit "not found" means "new version";
              # any other error (outage, auth, rate limit, network) fails the job instead of pushing
              # (validation-01 V-2: the guard must fail closed).
              tmp_remote=$(mktemp -d)
              set +e
              pull_err=$(helm pull "oci://ghcr.io/${OWNER}/charts/${chart_name}" --version "${chart_version}" -d "${tmp_remote}" 2>&1 >/dev/null)
              pull_rc=$?
              set -e
              if [ "${pull_rc}" -eq 0 ]; then
                echo "Chart ${chart_name}:${chart_version} already exists in GHCR. Verifying content immutability..."

                tmp_local_ext=$(mktemp -d)
                tmp_remote_ext=$(mktemp -d)
                tar -xzf "${pkg_file}" -C "${tmp_local_ext}"
                tar -xzf "${tmp_remote}/${chart_name}-${chart_version}.tgz" -C "${tmp_remote_ext}"

                if ! diff -r -u "${tmp_local_ext}" "${tmp_remote_ext}"; then
                  echo "::error::Chart ${chart_name}:${chart_version} exists in GHCR but packaged contents DIFFER!"
                  echo "::error::Re-releasing existing chart versions with modified templates is prohibited (L2-1)."
                  echo "::error::Bump 'version' in ${chart}/Chart.yaml to release changes."
                  rm -rf "${tmp_remote}" "${tmp_local_ext}" "${tmp_remote_ext}"
                  exit 1
                fi

                echo "Packaged chart is identical to released version. Skipping push."
                rm -rf "${tmp_remote}" "${tmp_local_ext}" "${tmp_remote_ext}"
              elif echo "${pull_err}" | grep -q ": not found"; then
                echo "Chart ${chart_name}:${chart_version} is a new version. Pushing to oci://ghcr.io/${OWNER}/charts..."
                helm push "${pkg_file}" "oci://ghcr.io/${OWNER}/charts"
                rm -rf "${tmp_remote}"
              else
                echo "::error::Cannot determine whether ${chart_name}:${chart_version} exists in GHCR (helm pull rc=${pull_rc}): ${pull_err}"
                echo "::error::Refusing to push (fail closed) - a transient error must never overwrite a released version."
                rm -rf "${tmp_remote}"
                exit 1
              fi
            fi
          done
